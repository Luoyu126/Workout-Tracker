services:
  postgres:
    image: postgres:16-alpine
    container_name: workout-tracker-postgres
    environment:
      POSTGRES_DB: workout_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - workout_tracker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workout_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workout_tracker_postgres_data:
